name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
    paths-ignore: [ "docs/**" ]        # ignorar cambios en docs
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:                  # permite ejecución manual
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
  schedule:
    - cron: '0 3 * * *'               # nightly at 03:00 UTC

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run unit tests
        run: pytest -q
        # si falla, el job se marcará como failed y siguientes jobs que dependan no se ejecutan

  build:
    name: Build (simulado)
    runs-on: ubuntu-latest
    needs: test        # solo corre si `test` tuvo éxito
    steps:
      - uses: actions/checkout@v4

      - name: Build simulado
        run: |
          echo "Building image myorg/myapp:${{ github.sha }} (simulado, sin Docker real)"
          echo "image: myorg/myapp:${{ github.sha }}" > image-info.txt
          echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> image-info.txt

      - name: Upload image info (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: image-info
          path: image-info.txt
        # los artifacts quedan disponibles en la pestaña "Summary" de cada run

  deploy:
    name: Deploy to environment
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      # permitimos despliegue manual o automático solo desde main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy script
        env:
          ENV: ${{ github.event.inputs.environment || 'staging' }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          echo "Deploying to $ENV"
          # ejemplo: scp/ssh para ejecutar un script de despliegue; aquí va tu lógica
          # ssh -i $SSH_KEY user@host "docker pull myorg/myapp:${{ github.sha }} && docker-compose up -d"
